name: Release

# Push a tag like v1.1.0 (the version in apps/desktop/package.json) to build the
# installers for macOS (Apple chip and Intel) and Windows into a draft release,
# with the download guide and the CHANGELOG section on its page. Publishing the
# draft on GitHub makes the installed apps offer the update. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple chip
          - os: macos-15-intel # Intel
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: apps/desktop
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./apps/desktop/package.json').version")" = "$GITHUB_REF_NAME"
      - name: CHANGELOG has this version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node apps/desktop/scripts/release-notes.mjs "$GITHUB_REF_NAME" > /dev/null
      - run: npm run bundle
        working-directory: apps/desktop
      - run: npm run browsers
        working-directory: apps/desktop
      - name: Build installers
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.yml --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
      - name: Smoke test the built app
        working-directory: apps/desktop
        shell: bash
        env:
          PLAYGUARD_SMOKE: "1"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./release/win-unpacked/PlayGuard.exe
          else
            ./release/mac*/PlayGuard.app/Contents/MacOS/PlayGuard
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: playguard-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error

  # The draft's page: which file to download, the first start, what changed.
  notes:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node apps/desktop/scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          gh release edit "$GITHUB_REF_NAME" --title "PlayGuard ${GITHUB_REF_NAME#v}" --notes-file notes.md

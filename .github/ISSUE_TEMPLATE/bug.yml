name: Bug report
description: PlayGuard did not do what you expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what you saw. A screenshot helps a lot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: playable
    attributes:
      label: Playable and ad network
      placeholder: e.g. game_applovin.html, AppLovin
  - type: dropdown
    id: step
    attributes:
      label: At which step
      options:
        - Upload
        - Playthrough on a phone
        - Playthrough with the mouse
        - AI tester
        - Checks
        - Result and report
        - Builds
        - Settings
        - Starting PlayGuard
        - Other
  - type: textarea
    id: report
    attributes:
      label: Report
      description: If the check finished, attach the "Developer" report or name its folder in reports/.
  - type: input
    id: computer
    attributes:
      label: Computer and browser
      placeholder: e.g. macOS 15, Chrome 140

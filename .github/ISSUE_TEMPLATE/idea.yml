name: Idea or new check
description: A new ad network, check, screen or convenience
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What are you suggesting
      options:
        - New ad network
        - New check
        - New device or screen
        - Convenience in the console
        - Report
        - Other
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What is needed and why
      description: Which problem it solves. For a network, a link to its playable requirements.
    validations:
      required: true

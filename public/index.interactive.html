  { id: '6b', name: 'Galaxy A55', w: 412, h: 915, hole: true, os: 'android', group: 'Android Midrange' },
  // Foldables
  { id: '4a', name: 'Galaxy Z Fold 6 (Inside)', w: 648, h: 790, fold: 'v', os: 'android', group: 'Foldables' },
  { id: '4b', name: 'Galaxy Z Fold 6 (Cover)', w: 402, h: 886, fold: 'v', os: 'android', group: 'Foldables' },
  { id: '4c', name: 'Pixel Fold 2 (Inside)', w: 600, h: 774, fold: 'v', os: 'android', group: 'Foldables' },
  // Tablets – iPad
  { id: '5a', name: 'iPad Pro 13 (M4)', w: 1024, h: 1366, os: 'ios', group: 'Tablets' },
  { id: '5b', name: 'iPad Pro 11 (M4)', w: 834, h: 1194, os: 'ios', group: 'Tablets' },

  { id: '5d', name: 'iPad Mini 8.3"', w: 744, h: 1133, os: 'ios', group: 'Tablets' },
  // Tablets – Android
  { id: '7a', name: 'Galaxy Tab S9 11"', w: 800, h: 1280, os: 'android', group: 'Android Tablets' },
  { id: '7b', name: 'Galaxy Tab S9 Ultra', w: 912, h: 1440, os: 'android', group: 'Android Tablets' },
  { id: '7c', name: 'Xiaomi Pad 6', w: 800, h: 1280, os: 'android', group: 'Android Tablets' },
];

const MODES = {
  LIVE_MIRROR: 'live_mirror',      // every device has its own playable + event mirroring
  SNAPSHOT_PER_DEVICE: 'snapshot'  // single master playable + per-device snapshots
};

function App() {
  const getCached = (k, d) => { const v = localStorage.getItem(k); try { return v ? JSON.parse(v) : d; } catch { return d; } };

  // Unified per-device geometry config (radius + cutout) with proportional sizing.
  // All size/offset values are fractions of the device short side.
  const DEVICE_GEOMETRY = {
    // iOS – Modern (Dynamic Island)
    'iphone 16 pro max': { radius: { kind: 'ratio', v: 0.085 }, cutout: { kind: 'island', size: 0.040, inset: 0.030 } },
    'iphone 16 pro': { radius: { kind: 'ratio', v: 0.085 }, cutout: { kind: 'island', size: 0.040, inset: 0.030 } },
    'iphone 15 pro max': { radius: { kind: 'ratio', v: 0.085 }, cutout: { kind: 'island', size: 0.040, inset: 0.030 } },
    'iphone 15 pro': { radius: { kind: 'ratio', v: 0.085 }, cutout: { kind: 'island', size: 0.040, inset: 0.030 } },
    'iphone 15': { radius: { kind: 'ratio', v: 0.085 }, cutout: { kind: 'island', size: 0.040, inset: 0.030 } },
    'iphone 14 pro max': { radius: { kind: 'ratio', v: 0.085 }, cutout: { kind: 'island', size: 0.040, inset: 0.030 } },
    'iphone 14 pro': { radius: { kind: 'ratio', v: 0.085 }, cutout: { kind: 'island', size: 0.040, inset: 0.030 } },

    // iOS – Classic (Notch)
    'iphone 14': { radius: { kind: 'ratio', v: 0.080 }, cutout: { kind: 'notch', w: 0.46, h: 0.085, inset: 0.0 } },
    'iphone 13': { radius: { kind: 'ratio', v: 0.080 }, cutout: { kind: 'notch', w: 0.46, h: 0.085, inset: 0.0 } },
    'iphone 11': { radius: { kind: 'ratio', v: 0.080 }, cutout: { kind: 'notch', w: 0.50, h: 0.090, inset: 0.0 } },
    'iphone se': { radius: { kind: 'ratio', v: 0.090 }, cutout: { kind: 'none' } },

    // Android – Flagships
    'samsung s24 ultra': { radius: { kind: 'px', v: 6 }, cutout: { kind: 'hole', size: 0.018, inset: 0.028 } },
    'samsung s24': { radius: { kind: 'ratio', v: 0.055 }, cutout: { kind: 'hole', size: 0.020, inset: 0.030 } },
    'google pixel 9 pro xl': { radius: { kind: 'ratio', v: 0.075 }, cutout: { kind: 'hole', size: 0.020, inset: 0.032 } },
    'google pixel 9': { radius: { kind: 'ratio', v: 0.075 }, cutout: { kind: 'hole', size: 0.020, inset: 0.032 } },
    'xiaomi 14 pro': { radius: { kind: 'ratio', v: 0.06 }, cutout: { kind: 'hole', size: 0.018, inset: 0.028 } },
    'oneplus 12': { radius: { kind: 'ratio', v: 0.06 }, cutout: { kind: 'hole', size: 0.020, inset: 0.030 } },

    // Android – Midrange
    'pixel 8a': { radius: { kind: 'ratio', v: 0.10 }, cutout: { kind: 'hole', size: 0.022, inset: 0.035 } },
    'galaxy a55': { radius: { kind: 'ratio', v: 0.065 }, cutout: { kind: 'hole', size: 0.020, inset: 0.032 } },

    // Foldables
    'galaxy z fold 6 (inside)': { radius: { kind: 'ratio', v: 0.03 }, cutout: { kind: 'none' } },
    'galaxy z fold 6 (cover)': { radius: { kind: 'ratio', v: 0.055 }, cutout: { kind: 'hole', size: 0.018, inset: 0.028 } },
    'pixel fold 2 (inside)': { radius: { kind: 'ratio', v: 0.03 }, cutout: { kind: 'none' } },

    // Tablets – iPad (no cutout)
    'ipad pro 13 (m4)': { radius: { kind: 'ratio', v: 0.028 }, cutout: { kind: 'none' } },
    'ipad pro 11 (m4)': { radius: { kind: 'ratio', v: 0.030 }, cutout: { kind: 'none' } },
    'ipad air 11': { radius: { kind: 'ratio', v: 0.034 }, cutout: { kind: 'none' } },
    'ipad mini': { radius: { kind: 'ratio', v: 0.040 }, cutout: { kind: 'none' } },

    // Tablets – Android (no cutout)
    'galaxy tab s9 11': { radius: { kind: 'ratio', v: 0.030 }, cutout: { kind: 'none' } },
    'galaxy tab s9 ultra': { radius: { kind: 'ratio', v: 0.024 }, cutout: { kind: 'none' } },
    'xiaomi pad 6': { radius: { kind: 'ratio', v: 0.028 }, cutout: { kind: 'none' } },
  };

  const pickGeometry = (deviceName) => {
    if (!deviceName || typeof deviceName !== 'string') return null;
    const n = deviceName.toLowerCase();

    // direct contains match (handles quotes/extra words like iPad Mini 8.3")
    for (const [key, geo] of Object.entries(DEVICE_GEOMETRY)) {
      if (key === 'ipad mini') {
        if (n.includes('ipad mini')) return geo;
        continue;
      }
      if (key === 'iphone se') {
        if (n.includes('iphone se')) return geo;
        continue;
      }
      if (key === 'galaxy tab s9 11') {
        if (n.includes('galaxy tab s9') && n.includes('11')) return geo;
        continue;
      }
      if (key === 'google pixel 9') {
        if (n === 'google pixel 9' || (n.includes('google pixel 9') && !n.includes('pro'))) return geo;
        continue;
      }
      if (n.includes(key)) return geo;
    }
    return null;
  };

  const getDeviceClass = (deviceName) => {
    if (!deviceName || typeof deviceName !== 'string') return '';
    const n = deviceName.toLowerCase();

    if (n.includes('s24 ultra')) return 'device-s24ultra';
    if (n.includes('s24') && !n.includes('ultra')) return 'device-s24';
    if (n.includes('pixel 9 pro xl')) return 'device-pixel9proxl';
    if (n.includes('pixel 9') && !n.includes('pro')) return 'device-pixel9';
    if (n.includes('xiaomi 14 pro')) return 'device-xiaomi14pro';
    if (n.includes('oneplus 12')) return 'device-oneplus12';
    if (n.includes('pixel 8a')) return 'device-pixel8a';
    if (n.includes('galaxy a55') || (n.includes('a55') && n.includes('galaxy'))) return 'device-galaxya55';
    if (n.includes('z fold 6') && n.includes('cover')) return 'device-zfold6cover';
    if (n.includes('z fold 6') && n.includes('inside')) return 'device-zfold6inside';
    if (n.includes('pixel fold 2') && n.includes('inside')) return 'device-pixelfold2inside';

    return '';
  };

  const getWrapperStyle = (deviceName, cw, ch, zoom) => {
    const geo = pickGeometry(deviceName);
    if (!geo || !geo.radius) return null;
    if (geo.radius.kind === 'px') return { borderRadius: geo.radius.v * zoom };
    const shortSide = Math.min(cw, ch);
    return { borderRadius: shortSide * geo.radius.v * zoom };
  };

  // Returns props for rendering cutout overlay element(s) inside iframe-wrapper
  const getCutoutRender = (deviceName, cw, ch, zoom, isLandscape) => {
    const geo = pickGeometry(deviceName);
    if (!geo || !geo.cutout || geo.cutout.kind === 'none') return null;

    const shortSide = Math.min(cw, ch);

    // Map inset/size against short side to keep it consistent across devices.
    const px = (ratio) => ratio * shortSide * zoom;

    // Portrait: x centered, y inset from top. Landscape: y centered, x inset from left.
    const portrait = !isLandscape;

    if (geo.cutout.kind === 'hole') {
      const size = px(geo.cutout.size);
      const inset = px(geo.cutout.inset);
      return {
        kind: 'hole',
        style: portrait
          ? { width: size, height: size, top: inset, left: '50%', transform: 'translateX(-50%)' }
          : { width: size, height: size, top: '50%', left: inset, transform: 'translateY(-50%)' },
      };
    }

    if (geo.cutout.kind === 'island') {
      // Use a pill: width ~= 2.8 * size, height = size
      const h = px(geo.cutout.size);
      const w = h * 2.8;
      const inset = px(geo.cutout.inset);
      return {
        kind: 'pill',
        style: portrait
          ? { width: w, height: h, top: inset, left: '50%', transform: 'translateX(-50%)', borderRadius: 9999 }
          : { width: h, height: w, top: '50%', left: inset, transform: 'translateY(-50%)', borderRadius: 9999 },
      };
    }

    if (geo.cutout.kind === 'notch') {
      // Notch rectangle with bottom rounding.
      const w = geo.cutout.w * shortSide * zoom;
      const h = geo.cutout.h * shortSide * zoom;
      const r = Math.min(w, h) * 0.35;
      // For landscape, put it on left edge as a vertical notch.
      return {
        kind: 'notch',
        style: portrait
          ? { width: w, height: h, top: 0, left: '50%', transform: 'translateX(-50%)', borderBottomLeftRadius: r, borderBottomRightRadius: r }
          : { width: h, height: w, top: '50%', left: 0, transform: 'translateY(-50%)', borderTopRightRadius: r, borderBottomRightRadius: r },
      };
    }

    return null;
  };

  const [devices, setDevices] = useState(() => getCached('audit_dev_v3', DEVICE_DATABASE));
  // replaced single htmlRaw/finalSrcDoc with multi-playable support
  const [playables, setPlayables] = useState(() => getCached('audit_playables_v1', [])); // [{id,name,htmlRaw}]
  const [activePlayableId, setActivePlayableId] = useState(() => getCached('audit_active_playable_v1', null));
  const [finalSrcDocs, setFinalSrcDocs] = useState({}); // { [playableId]: srcDoc }
  const [selectedIds, setSelectedIds] = useState(() => getCached('audit_sel_v3', ['1a', '3a', '1d']));
  const [activePreset, setActivePreset] = useState('all');
  const [zoom, setZoom] = useState(0.18);
  const [isLandscape, setIsLandscape] = useState(() => getCached('vibe_landscape', false));
  const [isDark, setIsDark] = useState(() => getCached('vibe_dark', false));
  const [mode, setMode] = useState(() => getCached('audit_mode_v1', MODES.SNAPSHOT_PER_DEVICE));
  // Side panels (persisted)
  const [isLeftOpen, setIsLeftOpen] = useState(() => getCached('audit_left_open_v1', true));
  const [isRightOpen, setIsRightOpen] = useState(() => getCached('audit_right_open_v1', true));

  const [results, setResults] = useState({});
  const [dragData, setDragData] = useState(null);
  const [relativeZonePerc, setRelativeZonePerc] = useState(null);
  const [isModifierPressed, setIsModifierPressed] = useState(false);
  const [refreshKey, setRefreshKey] = useState(0);
  const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
  const [isLoadingAudit, setIsLoadingAudit] = useState(false);
  const [masterFrame, setMasterFrame] = useState(null);
  const [framesByDevice, setFramesByDevice] = useState({});
  const [newDevice, setNewDevice] = useState({ name: '', width: '', height: '', os: 'ios', group: 'Custom' });
  const [soundEnabled, setSoundEnabled] = useState(() => getCached('audit_sound_enabled_v1', false));
  const [navLocked, setNavLocked] = useState(() => getCached('audit_nav_locked_v1', true));
  // Stable master device id to avoid event-bus confusion when selection order changes
  const [masterDeviceId, setMasterDeviceId] = useState(() => {
    const cached = getCached('audit_master_device_v1', null);
    if (cached && DEVICE_DATABASE.find(d => d.id === cached)) return cached;
    return (getCached('audit_sel_v3', ['1a', '3a', '1d'])[0]) || DEVICE_DATABASE[0].id;
  });

  const overlayRef = useRef(null);
  const iframeRefs = useRef({});
  const fileInputRef = useRef(null);
  const captureQueueRef = useRef(null);

  const activeDevices = useMemo(() => devices.filter(d => selectedIds.includes(d.id)), [devices, selectedIds]);
  const deviceGroups = useMemo(() => {
    const groups = {};
    devices.forEach(d => { if (!groups[d.group]) groups[d.group] = []; groups[d.group].push(d); });
    return groups;
  }, [devices]);

  // ensure master device is always part of selection; if not, add it back
  useEffect(() => {
    if (!devices.find(d => d.id === masterDeviceId)) return;
    if (!selectedIds.includes(masterDeviceId)) {
      setSelectedIds(prev => [...prev, masterDeviceId]);
    }
  }, [masterDeviceId, selectedIds, devices]);

  // persist master device id
  useEffect(() => {
    try { localStorage.setItem('audit_master_device_v1', JSON.stringify(masterDeviceId)); } catch (e) {}
  }, [masterDeviceId]);

  // Persist simple settings
  useEffect(() => { try { localStorage.setItem('audit_mode_v1', JSON.stringify(mode)); } catch (e) {} }, [mode]);
  useEffect(() => { try { localStorage.setItem('audit_sel_v3', JSON.stringify(selectedIds)); } catch (e) {} }, [selectedIds]);
  useEffect(() => { try { localStorage.setItem('audit_dev_v3', JSON.stringify(devices)); } catch (e) {} }, [devices]);
  useEffect(() => { try { localStorage.setItem('audit_sound_enabled_v1', JSON.stringify(soundEnabled)); } catch (e) {} }, [soundEnabled]);
  // Persist navigation lock option
  useEffect(() => { try { localStorage.setItem('audit_nav_locked_v1', JSON.stringify(navLocked)); } catch (e) {} }, [navLocked]);
  // when persisting devices/selectedIds, also persist playables/activePlayableId
  useEffect(() => { try { localStorage.setItem('audit_playables_v1', JSON.stringify(playables)); } catch (e) {} }, [playables]);
  useEffect(() => { try { localStorage.setItem('audit_active_playable_v1', JSON.stringify(activePlayableId)); } catch (e) {} }, [activePlayableId]);
  // Persist panel open state
  useEffect(() => { try { localStorage.setItem('audit_left_open_v1', JSON.stringify(isLeftOpen)); } catch (e) {} }, [isLeftOpen]);
  useEffect(() => { try { localStorage.setItem('audit_right_open_v1', JSON.stringify(isRightOpen)); } catch (e) {} }, [isRightOpen]);

  // Close drawers with Escape (especially useful on mobile)
  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.key === 'Escape') {
        setIsLeftOpen(false);
        setIsRightOpen(false);
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, []);

  // Notify playable frames via luna:mute / luna:unmute when sound setting changes
  useEffect(() => {
    // helper to dispatch custom events into each iframe contentWindow
    const sendLunaEventToFrames = (type) => {
      try {
        activeDevices.forEach(dev => {
          const frame = iframeRefs.current[dev.id];
          if (frame && frame.contentWindow) {
            try {
              const evt = new frame.contentWindow.CustomEvent(type, { detail: { source: 'AuditPro' } });
              frame.contentWindow.dispatchEvent(evt);
            } catch (e) {
              // Fallback: postMessage hint in case playable proxies it
              frame.contentWindow.postMessage({ type, source: 'AuditPro' }, '*');
            }
          }
        });
      } catch (e) {
        console.warn('[AUDIT] Failed to send', type, 'to frames', e);
      }
    };

    if (soundEnabled) {
      // User wants sound: ask playables to unmute
      sendLunaEventToFrames('luna:unmute');
    } else {
      // User wants mute: ask playables to mute
      sendLunaEventToFrames('luna:mute');
    }
  }, [soundEnabled, activeDevices]);

  // Inject script into playable: audio mute + navigation lock + canvas hook + event bus
  useEffect(() => {
    if (!playables.length) { setFinalSrcDocs({}); return; }
    const nextDocs = {};
    playables.forEach(p => {
      const webglHack = `<script>
(function() {
  var HOST_WANTS_SOUND = ${soundEnabled ? 'true' : 'false'};
  var HOST_LOCKS_NAV = ${navLocked ? 'true' : 'false'};
  try {
    if (!HOST_WANTS_SOUND) {
      // Mute all existing and future HTMLMediaElement
      (function() {
        const MediaProto = window.HTMLMediaElement && window.HTMLMediaElement.prototype;
        if (MediaProto) {
          const origPlay = MediaProto.play;
          const origPause = MediaProto.pause;
          const origVolumeDesc = Object.getOwnPropertyDescriptor(MediaProto, 'volume');
          const origMutedDesc = Object.getOwnPropertyDescriptor(MediaProto, 'muted');

          function forceSilent(el) {
            try {
              el.muted = true;
              el.volume = 0.0;
            } catch (e) {}
          }

          if (origPlay) {
            MediaProto.play = function(...args) {
              forceSilent(this);
              try { const p = origPlay.apply(this, args); if (p && typeof p.catch === 'function') p.catch(() => {}); return p; } catch (e) { return Promise.resolve(); }
            };
          }
          if (origPause) {
            MediaProto.pause = function(...args) {
              forceSilent(this);
              return origPause.apply(this, args);
            };
          }
          if (origVolumeDesc && origVolumeDesc.set) {
            Object.defineProperty(MediaProto, 'volume', {
              get: function() { return 0.0; },
              set: function(_) { /* ignore volume changes */ },
              configurable: true
            });
          }
          if (origMutedDesc && origMutedDesc.set) {
            Object.defineProperty(MediaProto, 'muted', {
              get: function() { return true; },
              set: function(_) { /* keep muted */ },
              configurable: true
            });
          }
        }
      })();

      // Mute Web Audio API by forcing master gain to 0
      (function() {
        const OrigAudioCtx = window.AudioContext || window.webkitAudioContext;
        if (OrigAudioCtx && !window.__auditPatchedAudioCtx) {
          function PatchedAudioContext(...args) {
            const ctx = new OrigAudioCtx(...args);
            try {
              const gain = ctx.createGain();
              gain.gain.value = 0.0;
              gain.connect(ctx.destination);
              if (ctx.destination && ctx.destination.disconnect) {
                try { ctx.destination.disconnect(); } catch (e) {}
              }
              ctx.destination = gain;
            } catch (e) {}
            return ctx;
          }
          PatchedAudioContext.prototype = OrigAudioCtx.prototype;
          window.AudioContext = PatchedAudioContext;
          window.webkitAudioContext = PatchedAudioContext;
          window.__auditPatchedAudioCtx = true;
        }
      })();
    }

    if (HOST_LOCKS_NAV) {
      // Block window.open
      (function() {
        try {
          var origOpen = window.open;
          window.open = function() {
            try { console.warn('[AUDIT] window.open blocked by container'); } catch (e) {}
            return null;
          };
        } catch (e) {
          try { console.warn('[AUDIT] failed to patch window.open', e); } catch (_) {}
        }
      })();

      // Block location redirects
      (function() {
        try {
          var loc = window.location;
          if (!loc) return;
          var origAssign = loc.assign ? loc.assign.bind(loc) : null;
          var origReplace = loc.replace ? loc.replace.bind(loc) : null;
          if (origAssign) {
            loc.assign = function(url) {
              try { console.warn('[AUDIT] location.assign blocked by container', url); } catch (e) {}
            };
          }
          if (origReplace) {
            loc.replace = function(url) {
              try { console.warn('[AUDIT] location.replace blocked by container', url); } catch (e) {}
            };
          }
          try {
            Object.defineProperty(window, 'location', {
              configurable: false,
              enumerable: true,
              get: function() { return loc; },
              set: function(_) {
                try { console.warn('[AUDIT] window.location set blocked by container'); } catch (e) {}
              }
            });

                          return;
                        }
                        setSelectedIds(prev => checked ? [...prev, d.id] : prev.filter(id => id !== d.id));
                      }}
                      className="w-4 h-4 accent-blue-600"
                    />
                    <div className="flex flex-col min-w-0 pr-4">
                      <span className="text-[11px] font-bold truncate dark:text-slate-300">
                        {d.name}{d.id === masterDeviceId && '  ★'}
                      </span>
                      <span className="text-[9px] text-slate-400 font-bold uppercase">{isLandscape ? `${d.h}x${d.w}` : `${d.w}x${d.h}`}</span>
                    </div>
                  </label>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Center content: device screens */}
      <div
        className={`flex-1 overflow-auto p-12 flex flex-col items-center transition-all ${isDark ? 'bg-slate-950' : 'bg-slate-100'}`}
        onDragOver={e => e.preventDefault()}
        onDrop={e => {
          e.preventDefault();
          const file = e.dataTransfer.files[0];
          handleFileChosen(file);
        }}
      >
        <input
          ref={fileInputRef}
          type="file"
          accept=".html,text/html"
          multiple
          style={{ display: 'none' }}
          onChange={(e) => handleFileChosen(e.target.files)}
        />
        {!hasPlayable ? (
          <button
            type="button"
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            className="h-full w-full flex flex-col items-center justify-center border-4 border-dashed border-slate-400/30 rounded-[40px] text-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
          >
            <span className="text-8xl mb-5">📂</span>
            <h2 className="text-2xl font-black uppercase tracking-widest text-center">
              Drop Playable Here
              <br/>
              <span className="text-xs opacity-50 block font-normal mt-2 tracking-normal">
                Click to choose HTML5 file or drag &amp; drop
              </span>
            </h2>
          </button>
        ) : (
          <>
            {/* small playable selector above screens */}
            <div className="w-full max-w-4xl flex items-center justify-between mb-3 text-[11px]">
              <div className="flex flex-wrap gap-2 items-center">
                <span className="font-bold uppercase text-slate-400 tracking-widest text-[9px]">Playable</span>
                {playables.map(p => (
                  <button
                    key={p.id}
                    onClick={() => setActivePlayableId(p.id)}
                    className={`px-2 py-1 rounded-full border text-[10px] truncate max-w-[160px] ${
                      (activePlayable && activePlayable.id === p.id)
                        ? 'bg-blue-600 border-blue-600 text-white shadow-sm'
                        : 'bg-slate-100 border-transparent text-slate-500 hover:bg-slate-200'
                    }`}
                    title={p.name}
                  >
                    {p.name}
                  </button>
                ))}
                <button
                  type="button"
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  className="px-2 py-1 rounded-full border border-dashed border-slate-300 text-[10px] text-slate-400 hover:bg-slate-50"
                >
                  + Add playable
                </button>
              </div>
            </div>

            <div className="w-full flex justify-center mb-6 text-[10px] font-bold uppercase tracking-widest text-slate-400">
              <span>
                {mode === MODES.LIVE_MIRROR
                  ? 'Live playable on every device — interact on ★ PRIMARY, events mirrored'
                  : 'Interact only with ★ PRIMARY — other devices show per-device snapshots'}
              </span>
            </div>

            <div className="flex flex-wrap gap-14 items-start justify-center pb-24 relative">
              {activeDevices.map((dev) => {
                const isMaster = dev.id === masterDeviceId;
                const cw = isLandscape ? dev.h : dev.w;
                const ch = isLandscape ? dev.w : dev.h;
                const frameForDevice = framesByDevice[dev.id] || framesByDevice.master || masterFrame;
                const frameImg = frameForDevice?.dataUrl || null;
                return (
                  <div key={dev.id} className="flex flex-col gap-4 group relative">
                    <div className="flex justify-between items-end px-1">
                      <span className="text-[11px] font-black uppercase text-slate-500 flex items-center">
                        <span className="status-dot" style={{ background: dev.os === 'ios' ? '#10b981' : '#f59e0b' }}></span>
                        {isMaster ? '★ PRIMARY' : dev.name}
                      </span>
                    </div>
                    <div className={`iframe-wrapper ${isMaster ? 'master-ring' : ''} ${getDeviceClass(dev.name)}`} style={{
                        width: cw * zoom,
                        height: ch * zoom,
                        ...(getWrapperStyle(dev.name, cw, ch, zoom) || {})
                      }}>
                      {mode === MODES.SNAPSHOT_PER_DEVICE && isMaster && (
                        <div ref={overlayRef} className={`selection-overlay ${isModifierPressed ? 'active' : ''}`} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp}>
                          {dragData && <div className="selection-marquee" style={{ left: Math.min(dragData.startX, dragData.currentX), top: Math.min(dragData.startY, dragData.currentY), width: Math.abs(dragData.currentX - dragData.startX), height: Math.abs(dragData.currentY - dragData.startY) }} />}
                        </div>
                      )}

                      {relativeZonePerc && mode === MODES.SNAPSHOT_PER_DEVICE && (
                        <div className="target-zone-visual" style={{
                          left: (relativeZonePerc.x * cw) * zoom, top: (relativeZonePerc.y * ch) * zoom,
                          width: (relativeZonePerc.w * cw) * zoom, height: (relativeZonePerc.h * ch) * zoom
                        }} />
                      )}

                      {/* Dynamic camera hole overlay - scales with zoom */}
                      {(() => {
                        const cutout = getCutoutRender(dev.name, cw, ch, zoom, isLandscape);
                        if (!cutout) return null;
                        return (
                          <div className={`camera-hole ${cutout.kind}`} style={cutout.style} />
                        );
                      })()}

                      {mode === MODES.LIVE_MIRROR ? (
                        <iframe
                          ref={el => iframeRefs.current[dev.id] = el}
                          key={refreshKey + '_' + dev.id + '_' + (activePlayable ? activePlayable.id : 'none')}
                          srcDoc={activePlayable ? finalSrcDocs[activePlayable.id] || '' : ''}
                          name={isMaster ? 'master_frame' : `slave_${dev.id}`}
                          style={{
                            width: cw,
                            height: ch,
                            transform: `scale(${zoom})`,
                            transformOrigin: 'top left',
                            pointerEvents: isMaster ? 'auto' : 'none'
                          }}
                        />
                      ) : (
                        // Snapshot-per-device mode
                        <>
                          {isMaster ? (
                            <iframe
                              ref={el => iframeRefs.current[dev.id] = el}
                              key={refreshKey + '_' + dev.id + '_' + (activePlayable ? activePlayable.id : 'none')}
                              srcDoc={activePlayable ? finalSrcDocs[activePlayable.id] || '' : ''}
                              name="master_frame"
                              style={{
                                width: cw,
                                height: ch,
                                transform: `scale(${zoom})`,
                                transformOrigin: 'top left',
                                pointerEvents: 'auto'
                              }}
                            />
                          ) : (
                            <div
                              className="slave-mirror"
                              style={{
                                width: cw,
                                height: ch,
                                transform: `scale(${zoom})`,
                                transformOrigin: 'top left',
                                position: 'relative',
                                overflow: 'hidden',
                                ...(getWrapperStyle(dev.name, cw, ch, zoom) || {}),
                                boxShadow: '0 0 0 2px rgba(15,23,42,0.35)'
                              }}
                            >
                              {(framesByDevice[dev.id] || masterFrame)?.dataUrl ? (
                                <img
                                  src={(framesByDevice[dev.id] || masterFrame).dataUrl}
                                  alt="Playable mirror frame"
                                  style={{
                                    width: '100%',
                                    height: '100%',
                                    display: 'block',
                                    pointerEvents: 'none',
                                    objectFit: 'cover'
                                  }}
                                />
                              ) : (
                                <div className="flex items-center justify-center w-full h-full text-[9px] text-slate-500 uppercase tracking-widest">
                                  Waiting for primary frame...
                                </div>
                              )}
                            </div>
                          )}
                        </>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      {/* Right sidebar: custom devices, game control, zoom/tools */}
      <div
        id="ap-right-sidebar"
        className={`w-80 flex flex-col p-6 z-[600] border-l flex-shrink-0 transition-colors ap-sidebar ap-sidebar-right ${isRightOpen ? 'ap-sidebar-open' : 'ap-sidebar-closed'} ${isDark ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'}`}
        aria-hidden={!isRightOpen}
      >
        {/* header toggle area */}
        <div className="flex justify-end -mt-1 mb-2">
          <button
            type="button"
            onClick={() => setIsRightOpen(v => !v)}
            className="p-2 rounded-full hover:bg-slate-100 text-[14px] ap-toggle-inline"
            title={isRightOpen ? 'Collapse panel' : 'Expand panel'}
            aria-label={isRightOpen ? 'Collapse right panel' : 'Expand right panel'}
            aria-controls="ap-right-sidebar"
            aria-expanded={isRightOpen}
          >
            <span className="ap-chev">{isRightOpen ? '›' : '‹'}</span>
          </button>
        </div>

        {/* Custom device form */}
        <div className="pt-4 border-t border-slate-200 dark:border-slate-800 mt-2">
          <p className="text-[10px] font-black text-slate-400 uppercase mb-2 px-1 tracking-widest">Custom Device</p>
          <div className="space-y-2 text-[10px]">
            <input
              type="text"
              placeholder="Name"
              value={newDevice.name}
              onChange={e => setNewDevice(v => ({ ...v, name: e.target.value }))}
              className="w-full px-2 py-1.5 rounded-lg border border-slate-200 text-[10px] outline-none focus:border-blue-500"
            />
            <div className="flex gap-2">
              <input
                type="number"
                placeholder="Width"
                value={newDevice.width}
                onChange={e => setNewDevice(v => ({ ...v, width: e.target.value }))}
                className="w-1/2 px-2 py-1.5 rounded-lg border border-slate-200 text-[10px] outline-none focus:border-blue-500"
              />
              <input
                type="number"
                placeholder="Height"
                value={newDevice.height}
                onChange={e => setNewDevice(v => ({ ...v, height: e.target.value }))}
                className="w-1/2 px-2 py-1.5 rounded-lg border border-slate-200 text-[10px] outline-none focus:border-blue-500"
              />
            </div>
            <div className="flex gap-2">
              <select
                value={newDevice.os}
                onChange={e => setNewDevice(v => ({ ...v, os: e.target.value }))}
                className="flex-1 px-2 py-1.5 rounded-lg border border-slate-200 text-[10px] outline-none focus:border-blue-500 bg-white"
              >
                <option value="ios">iOS</option>
                <option value="android">Android</option>
              </select>
              <input
                type="text"
                placeholder="Group (e.g. Custom)"
                value={newDevice.group}
                onChange={e => setNewDevice(v => ({ ...v, group: e.target.value }))}
                className="flex-1 px-2 py-1.5 rounded-lg border border-slate-200 text-[10px] outline-none focus:border-blue-500"
              />
            </div>
            <button
              type="button"
              onClick={handleAddCustomDevice}
              className="w-full mt-1 py-2 bg-slate-900 hover:bg-slate-700 text-white rounded-xl text-[10px] font-bold shadow-md transition-all uppercase"
            >
              + Add Device
            </button>
          </div>
        </div>

        {/* Game Control */}
        <div className="pt-4 border-t border-slate-200 dark:border-slate-800">
          <p className="text-[10px] font-black text-slate-400 uppercase mb-2 px-1 tracking-widest">Game Control</p>
          <div className="bg-green-500/10 dark:bg-green-500/5 rounded-2xl p-3 mb-4 border border-green-500/20 space-y-2">
            <button
              onClick={() => {
                console.log('[UI] Triggering startGame...');
                const iframeEl = iframeRefs.current[activeDevices[0]?.id];
                if (iframeEl?.contentWindow?.startGameSync) {
                  iframeEl.contentWindow.startGameSync();
                } else {
                  console.warn('startGameSync not available');
                }
              }}
              disabled={!hasPlayable}
              className="w-full py-3 bg-green-500 hover:bg-green-600 disabled:opacity-30 text-white rounded-xl text-[10px] font-black shadow-lg shadow-green-500/30 transition-all uppercase mb-2"
            >
              ▶ Start Game
            </button>
            {mode === MODES.SNAPSHOT_PER_DEVICE && (
              <button
                onClick={() => {
                  console.log('[UI] Triggering per-device snapshot...');
                  runPerDeviceSnapshotCapture();
                }}
                disabled={!hasPlayable || activeDevices.length === 0}
                className="w-full py-2 bg-slate-900 hover:bg-slate-700 disabled:opacity-30 text-white rounded-xl text-[10px] font-bold shadow-md transition-all uppercase"
              >
                📱 Snapshot Per Device
              </button>
            )}
            <button
              type="button"
              onClick={handleClearPlayables}
              disabled={!hasPlayable}
              className="w-full py-2 bg-red-500/90 hover:bg-red-600 disabled:opacity-30 text-white rounded-xl text-[10px] font-bold shadow-md transition-all uppercase"
            >
              ✕ Clear Playables
            </button>
          </div>
        </div>

        {/* Zoom & tools */}
        <div className="pt-4 border-t border-slate-200 dark:border-slate-800">
          <div className="flex justify-between items-center px-1"><span className="text-[10px] font-bold text-slate-400 uppercase">Zoom</span><span className="text-[11px] font-black text-blue-600">{Math.round(zoom * 100)}%</span></div>
          <input type="range" min="0.1" max="1" step="0.01" value={zoom} onChange={(e) => setZoom(parseFloat(e.target.value))} className="w-full h-1.5 accent-blue-600 cursor-pointer rounded-lg bg-slate-200 dark:bg-slate-700" />
          <div className="grid grid-cols-3 gap-2">
            <button
              onClick={() => {
                // Full playable reset: remount iframes and clear overlay-related state
                setRefreshKey(k => k + 1);
                setRelativeZonePerc(null);
                setDragData(null);
                setResults({});
              }}
              className="py-3 bg-slate-800 text-white rounded-xl font-bold text-[10px] uppercase"
            >
              Reset
            </button>
            <button
              onClick={() => {
                // Only clear highlight/selection overlays
                setRelativeZonePerc(null);
                setDragData(null);
                setResults({});
              }}
              disabled={!relativeZonePerc && !dragData}
              className="py-3 bg-slate-600 text-white rounded-xl font-bold text-[10px] uppercase disabled:opacity-30"
            >
              Reset Highlight
            </button>
            <button
              onClick={() => { /* TODO: implement validate logic */ }}
              disabled={!relativeZonePerc}
              className="py-3 bg-blue-600 text-white rounded-xl font-black shadow-lg disabled:opacity-30 uppercase text-[10px]"
            >
              Validate
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
